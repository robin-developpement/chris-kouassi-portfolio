<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Créations — Robin Becanti</title>
  <script>(function(){ const t=localStorage.getItem('rb_theme')||'dark'; document.documentElement.setAttribute('data-theme',t); })();</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css"/>
  <style>
  .page-hero {
    padding:10rem 3.5rem 4.5rem; background:var(--bg2);
    border-bottom:1px solid var(--border); position:relative; overflow:hidden;
  }
  .page-hero::after {
    content:''; position:absolute; right:0; top:0; width:50%; height:100%;
    background:radial-gradient(ellipse at 80% 50%, rgba(248,123,27,.09) 0%, transparent 70%);
  }
  .page-hero h1 { font-family:var(--font-display); font-size:clamp(3rem,6vw,6rem); font-weight:800; line-height:1; color:var(--text); }
  .page-hero h1 em { font-style:italic; color:var(--orange); font-weight:600; }
  .page-hero p { color:var(--text-muted); margin-top:1rem; font-size:.95rem; max-width:500px; line-height:1.7; }

  /* Filter bar */
  .fbar {
    padding:1.2rem 3.5rem; background:var(--bg2);
    border-bottom:1px solid var(--border);
    display:flex; gap:.8rem; flex-wrap:wrap; align-items:center;
  }
  .fbtn {
    padding:.4rem 1.1rem; border-radius:6px;
    font-size:.75rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    border:1.5px solid var(--border); color:var(--text-muted);
    background:transparent; cursor:none; transition:all .2s !important;
  }
  .fbtn:hover,.fbtn.active { border-color:var(--orange); color:var(--orange); background:var(--badge-bg); }

  /* Gallery */
  .gallery { padding:3rem 3.5rem; background:var(--bg); }
  .ggrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:1.5rem; }

  .gcard {
    position:relative; overflow:hidden; border-radius:12px;
    background:var(--card-bg); border:1px solid var(--border);
    aspect-ratio:4/3; cursor:pointer;
    transition:border-color .3s, transform .3s !important;
  }
  .gcard:hover { border-color:var(--orange); transform:translateY(-4px); box-shadow:var(--shadow); }
  .gcard img { width:100%; height:100%; object-fit:cover; transition:transform .6s !important; }
  .gcard:hover img { transform:scale(1.07); }
  .gov {
    position:absolute; inset:0; border-radius:12px;
    background:linear-gradient(to top, rgba(10,18,50,.92) 0%, transparent 55%);
    opacity:0; transition:opacity .3s !important;
    display:flex; flex-direction:column; justify-content:flex-end; padding:1.4rem;
  }
  .gcard:hover .gov { opacity:1; }
  .gcat { font-family:var(--font-mono); font-size:.62rem; letter-spacing:.14em; text-transform:uppercase; color:var(--orange); margin-bottom:.4rem; }
  .gtitle { font-family:var(--font-display); font-size:1.05rem; font-weight:700; color:#fff; }
  .gbtns { display:flex; gap:.5rem; margin-top:.8rem; }
  .gbtn { padding:.3rem .8rem; border-radius:4px; font-size:.66rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; border:none; transition:all .2s !important; }
  .gbtn-view { background:var(--orange); color:#fff; }
  .gbtn-del { background:rgba(255,60,60,.15); color:#ff5555; border:1px solid rgba(255,60,60,.3); }
  .gbtn-del:hover { background:rgba(255,60,60,.3); }

  .empty-s {
    grid-column:1/-1; text-align:center; padding:5rem 2rem;
    border:1px dashed rgba(248,123,27,.25); border-radius:12px;
  }
  .empty-s svg { width:44px; height:44px; margin:0 auto 1.5rem; opacity:.4; stroke:var(--orange); }
  .empty-s p { font-family:var(--font-mono); font-size:.8rem; color:var(--text-muted); }
  .empty-s span { color:var(--orange); }

  /* Lightbox */
  .lb {
    position:fixed; inset:0; z-index:900;
    background:rgba(0,0,0,.96); backdrop-filter:blur(16px);
    display:none; align-items:center; justify-content:center; padding:2rem;
  }
  .lb.open { display:flex; }
  .lb-inner { position:relative; max-width:960px; width:100%; }
  .lb-img { width:100%; max-height:78vh; object-fit:contain; border-radius:10px; }
  .lb-close { position:absolute; top:-2.8rem; right:0; background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer; font-family:var(--font-mono); transition:color .2s !important; }
  .lb-close:hover { color:var(--orange); }
  .lb-meta { margin-top:1rem; display:flex; justify-content:space-between; align-items:center; }
  .lb-title { font-family:var(--font-display); font-size:1.1rem; font-weight:700; color:#fff; }
  .lb-nav { display:flex; gap:.8rem; }
  .lb-nav button { padding:.4rem 1rem; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); color:#fff; font-family:var(--font-mono); font-size:.72rem; cursor:pointer; border-radius:6px; transition:all .2s !important; }
  .lb-nav button:hover { border-color:var(--orange); color:var(--orange); }

  /* Count badge (top right of page) */
  .count-badge {
    position:absolute; top:2rem; right:3.5rem; z-index:2;
    background:var(--badge-bg); border:1px solid rgba(248,123,27,.3);
    border-radius:8px; padding:.5rem 1rem;
    font-family:var(--font-mono); font-size:.68rem; color:var(--orange);
    display:none;
  }
  .count-badge.show { display:block; }

  @media(max-width:900px){
    .page-hero,.fbar,.gallery { padding-left:1.5rem; padding-right:1.5rem; }
    .page-hero { padding-top:7rem; }
    .count-badge { right:1.5rem; }
    .ggrid { grid-template-columns:1fr 1fr; gap:1rem; }
  }
  @media(max-width:550px){ .ggrid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<script src="assets/js/nav.js"></script>

<div class="page-hero" style="position:relative">
  <div class="slabel reveal">Portfolio</div>
  <h1 class="reveal" style="transition-delay:.1s">Mes <em>Créations</em></h1>
  <p class="reveal" style="transition-delay:.2s">Webdesign · Infographie · Branding · Montage vidéo.<br>Une sélection de mes réalisations.</p>
  <div class="count-badge" id="countBadge"></div>
</div>

<div class="fbar">
  <button class="fbtn active" data-f="all">Tout</button>
  <button class="fbtn" data-f="webdesign">Webdesign</button>
  <button class="fbtn" data-f="infographie">Infographie</button>
  <button class="fbtn" data-f="branding">Branding</button>
  <button class="fbtn" data-f="social">Social Media</button>
  <button class="fbtn" data-f="user">Mes imports</button>
</div>

<section class="gallery">
  <div class="ggrid" id="ggrid"></div>
</section>

<!-- Lightbox -->
<div class="lb" id="lb">
  <div class="lb-inner">
    <button class="lb-close" id="lbClose">× Fermer</button>
    <img class="lb-img" id="lbImg" src="" alt=""/>
    <div class="lb-meta">
      <span class="lb-title" id="lbTitle"></span>
      <div class="lb-nav">
        <button id="lbPrev">← Préc.</button>
        <button id="lbNext">Suiv. →</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/main.js"></script>
<script>
/* ─── Gallery data ─── */
const DEMO = [
  {id:'d1',src:'./assets/images/photo01.webp',title:'Interface Dashboard',cat:'webdesign',type:'demo'},
  {id:'d2',src:'https://images.unsplash.com/photo-1558655146-364adaf1fcc9?w=800&q=80',title:'Identité Visuelle Luxora',cat:'branding',type:'demo'},
  {id:'d3',src:'https://images.unsplash.com/photo-1586717791821-3f44a563fa4c?w=800&q=80',title:'Campagne Social Media',cat:'social',type:'demo'},
  {id:'d4',src:'https://images.unsplash.com/photo-1545235617-9465d2a55698?w=800&q=80',title:'Affiche Événementielle',cat:'infographie',type:'demo'},
  {id:'d5',src:'https://images.unsplash.com/photo-1572044162444-ad60f128bdea?w=800&q=80',title:'Landing Page DISTRICOM',cat:'webdesign',type:'demo'},
  {id:'d6',src:'https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=800&q=80',title:'Contenu Instagram',cat:'social',type:'demo'},
  {id:'d7',src:'https://images.unsplash.com/photo-1559028012-481c04fa702d?w=800&q=80',title:"Charte Graphique Go'Babi",cat:'branding',type:'demo'},
  {id:'d8',src:'https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?w=800&q=80',title:'App Mobile UI',cat:'webdesign',type:'demo'},
  {id:'d9',src:'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=800&q=80',title:'Bannière Publicitaire',cat:'infographie',type:'demo'},
  {id:'d10',src:'https://images.unsplash.com/photo-1542744095-291d1f67b221?w=800&q=80',title:'Présentation Corporate',cat:'branding',type:'demo'},
  {id:'d11',src:'https://images.unsplash.com/photo-1547658719-da2b51169166?w=800&q=80',title:'Site Vitrine Orange CI',cat:'webdesign',type:'demo'},
  {id:'d12',src:'https://images.unsplash.com/photo-1611532736597-de2d4265fba3?w=800&q=80',title:'Story Facebook',cat:'social',type:'demo'},
];

let userItems = [];
try { userItems = JSON.parse(localStorage.getItem('rb_gallery')||'[]'); } catch(e){}

let filter = 'all', lbIdx = 0, visible = [];

/* Expose renderGallery to main.js admin panel */
window.renderGallery = render;

function catLabel(c){ return {webdesign:'Webdesign',infographie:'Infographie',branding:'Branding',social:'Social Media',user:'Mon import',uploaded:'Mon import'}[c]||c; }
function getFiltered(){
  try { userItems = JSON.parse(localStorage.getItem('rb_gallery')||'[]'); } catch(e){}
  const all = [...DEMO,...userItems];
  if(filter==='all') return all;
  if(filter==='user') return all.filter(i=>i.type==='user');
  return all.filter(i=>i.cat===filter);
}

function render(){
  visible = getFiltered();
  const g = document.getElementById('ggrid');
  const badge = document.getElementById('countBadge');

  // Count badge: only show if there are user imports
  try { userItems = JSON.parse(localStorage.getItem('rb_gallery')||'[]'); } catch(e){}
  if(userItems.length > 0){
    badge.textContent = `${userItems.length} import${userItems.length>1?'s':''}`;
    badge.classList.add('show');
  } else {
    badge.classList.remove('show');
  }

  if(!visible.length){
    g.innerHTML=`<div class="empty-s">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m3 9 4-4 4 4 4-4 4 4"/><circle cx="7.5" cy="14.5" r="1.5"/></svg>
      <p>Aucune création dans cette catégorie.<br><span>Changez le filtre ou ajoutez des images.</span></p>
    </div>`;
    return;
  }

  g.innerHTML = visible.map((item,i)=>`
    <div class="gcard" data-i="${i}">
      <img src="${item.src}" alt="${item.title}" loading="lazy"/>
      <div class="gov">
        <div class="gcat">${catLabel(item.cat)}</div>
        <div class="gtitle">${item.title}</div>
        <div class="gbtns">
          <button class="gbtn gbtn-view" onclick="openLb(${i},event)">↗ Agrandir</button>
          ${item.type==='user'?`<button class="gbtn gbtn-del" onclick="delItem('${item.id}',event)">✕ Retirer</button>`:''}
        </div>
      </div>
    </div>`).join('');

  g.querySelectorAll('.gcard').forEach((c,i)=>{
    c.style.cssText += 'opacity:0;transform:translateY(16px)';
    c.style.transition = `opacity .4s ${i*.04}s ease, transform .4s ${i*.04}s ease, border-color .3s, box-shadow .3s`;
    requestAnimationFrame(()=>{ c.style.opacity=1; c.style.transform='translateY(0)'; });
    c.addEventListener('click', e=>{ if(!e.target.closest('.gbtn')) openLb(parseInt(c.dataset.i), e); });
  });
}

function delItem(id, e){
  e.stopPropagation();
  let its = [];
  try { its = JSON.parse(localStorage.getItem('rb_gallery')||'[]'); } catch(e){}
  localStorage.setItem('rb_gallery', JSON.stringify(its.filter(i=>i.id!==id)));
  render();
}

/* Filters */
document.querySelectorAll('.fbtn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); filter=b.dataset.f; render();
  });
});

/* Lightbox */
function openLb(i, e){ if(e) e.stopPropagation(); lbIdx=i; updateLb(); document.getElementById('lb').classList.add('open'); }
function updateLb(){ const it=visible[lbIdx]; document.getElementById('lbImg').src=it.src; document.getElementById('lbTitle').textContent=it.title; }
document.getElementById('lbClose').onclick=()=>document.getElementById('lb').classList.remove('open');
document.getElementById('lbPrev').onclick=()=>{ lbIdx=(lbIdx-1+visible.length)%visible.length; updateLb(); };
document.getElementById('lbNext').onclick=()=>{ lbIdx=(lbIdx+1)%visible.length; updateLb(); };
document.getElementById('lb').addEventListener('click',e=>{ if(e.target===document.getElementById('lb')) document.getElementById('lb').classList.remove('open'); });
document.addEventListener('keydown',e=>{
  if(!document.getElementById('lb').classList.contains('open')) return;
  if(e.key==='Escape') document.getElementById('lb').classList.remove('open');
  if(e.key==='ArrowLeft'){ lbIdx=(lbIdx-1+visible.length)%visible.length; updateLb(); }
  if(e.key==='ArrowRight'){ lbIdx=(lbIdx+1)%visible.length; updateLb(); }
});

render();
</script>
</body>
</html>
